name: Refresh fallback snapshot
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index.html from the sheet
        env:
          SHEET_ID: ${{ vars.SHEET_ID || '1PEBhIjJ8oHqoUIwvSUZCgWIy4DzNANRt' }}
          SHEET_GID: ${{ vars.SHEET_GID || '874835443' }}
        run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh fallback snapshot"
          git push
