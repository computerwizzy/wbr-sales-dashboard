<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WBR Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light;--bg:#111417;--card:#ffffff;--ink:#111417;--ink-2:#4a4f55;--muted:#8a9096;--border:#d9dcdf;--brand:#ff0707;--brand-hover:#dd1d1d;--bad:#c62f2f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{background:var(--card);border-radius:4px;border-top:6px solid #dd1d1d;width:100%;max-width:400px;padding:22px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.45);position:relative}
.langs{position:absolute;top:14px;right:14px;display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.langbtn{border:0;background:#fff;color:var(--ink-2);font:inherit;font-size:12px;font-weight:700;padding:3px 9px;cursor:pointer;letter-spacing:.04em}
.langbtn[aria-pressed="true"]{background:#dd1d1d;color:#fff}
.logo{display:block;height:64px;width:auto;margin:14px auto 18px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;margin:0}
h1{font-size:24px;font-weight:800;margin:4px 0 20px;text-align:center;line-height:1.1}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.pw{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.pw:focus-within{border-color:#dd1d1d;box-shadow:0 0 0 3px rgba(221,29,29,.15)}
input[type=password],input[type=text]{flex:1;min-width:0;border:0;padding:12px 12px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:none}
.eye{border:0;background:#f3f4f5;color:var(--ink-2);padding:0 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.eye:hover{background:#e9ebed}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 18px;font-size:13.5px;color:var(--ink-2)}
.row label{display:inline-flex;align-items:center;gap:8px;font:inherit;text-transform:none;letter-spacing:0;margin:0;cursor:pointer;color:var(--ink-2)}
.row input{accent-color:var(--brand);width:16px;height:16px;margin:0}
button.go{width:100%;border:0;border-radius:6px;background:var(--brand);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:13px;cursor:pointer}
button.go:hover{background:var(--brand-hover)}
button.go:disabled{opacity:.7;cursor:progress}
:focus-visible{outline:2px solid #dd1d1d;outline-offset:2px}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:12px 0 0;text-align:center}
.note{color:var(--muted);font-size:12.5px;text-align:center;margin:18px 0 0;line-height:1.4}
.note a{color:var(--ink-2)}
</style>
</head>

(function(){
  const $=id=>document.getElementById(id);
  const TX={en:{title:'Sales dashboard',password:'Password',show:'Show',hide:'Hide',remember:'Remember this device',open:'Open dashboard',unlocking:'Unlocking…',note:'The dashboard is encrypted. It unlocks in your browser and nothing is sent anywhere.',guide:'User guide',wrong:'That password did not work. Check it and try again.',https:'This page must be opened over https (or localhost) to unlock.'},
            es:{title:'Tablero de ventas',password:'Contraseña',show:'Mostrar',hide:'Ocultar',remember:'Recordar este dispositivo',open:'Abrir tablero',unlocking:'Abriendo…',note:'El tablero está cifrado. Se abre en tu navegador y no se envía nada a ningún lado.',guide:'Manual de uso',wrong:'Esa contraseña no funcionó. Revísala e inténtalo de nuevo.',https:'Esta página debe abrirse por https (o localhost) para poder desbloquearse.'}};
  let LANG='en'; try{ LANG=localStorage.getItem('wbr-lang') || ((navigator.language||'').toLowerCase().startsWith('es')?'es':'en'); }catch(e){}
  const tx=k=>(TX[LANG]||TX.en)[k];
  const err=$('err'), go=$('go'), pw=$('pw');
  function applyLang(){ document.documentElement.lang=LANG; document.querySelectorAll('[data-t]').forEach(el=>{ const k=el.dataset.t; if(k==='show') el.textContent = pw.type==='password'?tx('show'):tx('hide'); else el.textContent=tx(k); }); document.querySelectorAll('.langbtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG))); }
  document.querySelectorAll('.langbtn').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.lang; try{ localStorage.setItem('wbr-lang',LANG); }catch(e){} applyLang(); }));
  const b64=s=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const salt=b64(ENC.salt), iv=b64(ENC.iv), data=b64(ENC.data);
  const KEY='wbr-dash-key';
  applyLang();
  function fail(msg){ err.textContent=msg; err.hidden=false; go.disabled=false; go.textContent=tx('open'); }
  if(!(window.crypto&&crypto.subtle)){ fail(tx('https')); go.disabled=true; }
  $('eye').addEventListener('click',()=>{ const t=pw.type==='password'; pw.type=t?'text':'password'; $('eye').textContent=t?tx('hide'):tx('show'); pw.focus(); });
  async function deriveKey(password){ const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ENC.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, true, ['decrypt']); }
  const loaded = () => document.readyState==='loading' ? new Promise(r=>document.addEventListener('DOMContentLoaded', r, {once:true})) : Promise.resolve();
  async function unlock(key){ const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data); const html=new TextDecoder().decode(pt);
    await loaded(); // document.open() is ignored while the page is still parsing, which would append the dashboard under the login card
    document.open(); document.write(html); document.close(); }
  async function tryStored(){ let raw=null; try{ raw=sessionStorage.getItem(KEY)||localStorage.getItem(KEY); }catch(e){} if(!raw) return; try{ const key=await crypto.subtle.importKey('raw', b64(raw), {name:'AES-GCM'}, true, ['decrypt']); await unlock(key); }catch(e){ try{ sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); }catch(_){} } }
  $('f').addEventListener('submit', async ev=>{ ev.preventDefault(); err.hidden=true; go.disabled=true; go.textContent=tx('unlocking');
    try{ const key=await deriveKey(pw.value); const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))));
      try{ sessionStorage.setItem(KEY, raw); if($('remember').checked) localStorage.setItem(KEY, raw); }catch(e){}
      await unlock(key);
    }catch(e){ try{ sessionStorage.removeItem(KEY); }catch(_){} fail(tx('wrong')); pw.select(); }
  });
  if(window.crypto&&crypto.subtle) tryStored();
})();
