<title>WBR Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f4; --surface:#ffffff; --surface-2:#f2f2f2;
  --ink:#111417; --ink-2:#4d4d4d; --muted:#8a8a8a;
  --grid:#e6e6e6; --axis:#c8c8c8; --border:rgba(17,20,23,.10); --border-strong:rgba(17,20,23,.28);
  --s1:#dd1d1d; --s2:#111417; --s3:#8a9096; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --de:#cfd2d5; --de-line:#b4b8bc;
  --o1:#f3b0b0; --o2:#dd1d1d; --o3:#7a0f0f;
  --good:#0a7a2a; --bad:#9b1c1c;
  --chip-on-bg:#111417; --chip-on-fg:#ffffff;
  --brand:#ff0707; --brand-deep:#dd1d1d; --link:#c41616; --focus:#dd1d1d;
  --shadow:0 1px 2px rgba(11,11,11,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0e10; --surface:#161a1d; --surface-2:#1f2429;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.24);
    --s1:#f0433f; --s2:#e6e8ea; --s3:#8a9096; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --de:#3a3d41; --de-line:#55595e;
    --o1:#f3b0b0; --o2:#f0433f; --o3:#9c1a1a;
    --good:#3ec46a; --bad:#ff8a86;
    --chip-on-bg:#ffffff; --chip-on-fg:#0b0b0b;
    --brand:#ff2a26; --brand-deep:#dd1d1d; --link:#ff8a86; --focus:#ff5f5c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0e10; --surface:#161a1d; --surface-2:#1f2429;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.24);
  --s1:#f0433f; --s2:#e6e8ea; --s3:#8a9096; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --de:#3a3d41; --de-line:#55595e;
  --o1:#f3b0b0; --o2:#f0433f; --o3:#9c1a1a;
  --good:#3ec46a; --bad:#ff8a86;
  --chip-on-bg:#ffffff; --chip-on-fg:#0b0b0b;
  --brand:#ff2a26; --brand-deep:#dd1d1d; --link:#ff8a86; --focus:#ff5f5c;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 "Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:18px 48px}
h1,h2,h3{font-family:"Assistant",system-ui,sans-serif;text-wrap:balance;margin:0}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.band{background:#111417;color:#fff;border-top:6px solid var(--brand-deep);--ink:#fff;--ink-2:#d3d6da;--muted:#9aa0a6;--link:#ff8a86;--surface-2:#22262b;--border:rgba(255,255,255,.15);--border-strong:rgba(255,255,255,.3)}
.hdr{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:16px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{height:52px;width:auto;display:block;flex:none;background:#fff;padding:4px 8px;border-radius:4px;box-sizing:content-box}
.hdr h1{font-size:27px;line-height:1.05;font-weight:800;letter-spacing:.005em}
.hdr h1 small{display:block;font-family:"Assistant",sans-serif;font-size:14.5px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:4px}
.hdr .meta{font-size:13.5px;color:var(--ink-2);text-align:right;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.badge.live i{background:var(--good)}
.warn{color:var(--bad)}
.hdr .meta code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--border);padding:1px 5px;border-radius:3px}

/* filters */
.fbar{background:var(--surface);border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow);padding:14px 16px 16px;margin-bottom:14px;display:grid;gap:14px}
.frow{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.fgroup.grow{flex:1 1 460px}
.flab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);line-height:1.2}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;border-top:1px solid var(--grid);padding-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--chip-on-bg);background:var(--surface);color:var(--ink);border-radius:4px;padding:0 14px;height:40px;font-size:14.5px;font-weight:700;cursor:pointer;line-height:1}
.chip:hover{border-color:var(--brand-deep)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.fbar select,.fbar input[type=date]{font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--border-strong);border-radius:4px;padding:0 10px;height:40px;width:100%;min-width:0;color-scheme:inherit}
.frow select,.frow input[type=date]{width:160px;max-width:100%}
.fbar select:hover,.fbar input[type=date]:hover{border-color:var(--ink)}
.fbar select:disabled{color:var(--muted);border-style:dashed;cursor:not-allowed;font-weight:500}
.reset{height:40px;border:1px solid var(--chip-on-bg);background:var(--surface);color:var(--ink);border-radius:4px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;padding:0 14px}
.reset:hover{border-color:var(--brand-deep);color:var(--brand-deep)}
.hdr .reset{height:auto;border:0;background:none;color:var(--link);padding:0 6px;font-weight:600}
@media (max-width:560px){ .frow select,.frow input[type=date]{width:100%} .frow .fgroup:not(.grow){flex:1 1 40%} .reset{width:100%} }

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
@media (min-width:1000px){ .kpis{grid-template-columns:repeat(4,1fr)} }
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px 14px 10px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;gap:2px 8px;min-height:104px}
.kpi .lbl{grid-column:1/3;font-size:14px;color:var(--ink-2);font-weight:500}
.kpi .val{font-family:"Assistant",sans-serif;font-size:31px;font-weight:700;line-height:1.05;letter-spacing:-.005em;align-self:end}
.kpi .spark{grid-row:2;align-self:end;width:84px;height:30px}
.kpi .dlt{grid-column:1/3;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;line-height:1.3}
.kpi .dlt b{font-weight:600;color:var(--ink-2)}
.kpi .dlt b.up{color:var(--good)}
.kpi .dlt b.down{color:var(--bad)}

/* cards & grid */
.grid{display:grid;gap:12px;margin-bottom:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow);padding:14px 16px 12px;min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.card-h h2{font-size:19px;font-weight:700;line-height:1.2}
.card-h .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.tbtn{border:1px solid var(--border-strong);background:transparent;border-radius:4px;font-size:13px;padding:4px 10px;cursor:pointer;color:var(--ink-2);white-space:nowrap;flex:none}
.tbtn:hover{background:var(--surface-2)}
.tbtn[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.viz{position:relative;min-width:0}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink-2);margin-top:6px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend .ln{width:16px;height:0;border-top:2.5px solid;display:inline-block;border-radius:2px}
.empty{color:var(--muted);font-size:14.5px;padding:40px 0;text-align:center}
.side{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.side div{background:var(--surface-2);border-radius:4px;padding:8px 10px}
.side .k{font-size:13px;color:var(--ink-2)}
.side .v{font-family:"Assistant",sans-serif;font-size:23px;font-weight:700;line-height:1.1}
.side .s{font-size:13px;color:var(--muted)}

/* chart marks */
.c1{fill:var(--s1)} .c2{fill:var(--s2)} .c3{fill:var(--s3)} .c4{fill:var(--s4)} .c5{fill:var(--s5)} .c6{fill:var(--s6)} .c7{fill:var(--s7)} .c8{fill:var(--s8)} .cde{fill:var(--de)}
.o1{fill:var(--o1)} .o2{fill:var(--o2)} .o3{fill:var(--o3)}
.l1{stroke:var(--s1)} .l2{stroke:var(--s2)} .lde{stroke:var(--de-line)}
.gl{stroke:var(--grid);stroke-width:1} .base{stroke:var(--axis);stroke-width:1}
.ax{fill:var(--muted);font-size:12.5px} .dl{fill:var(--ink-2);font-size:12.5px;font-weight:600}
.lbl{fill:var(--ink);font-size:13.5px}
.hit{fill:transparent;cursor:crosshair}
.bar.hover, .seg.hover{filter:brightness(1.12)}
.xh{stroke:var(--axis);stroke-width:1}
.ring{stroke:var(--surface);stroke-width:2}

/* tooltip */
#tip{position:absolute;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:9px 11px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.14);min-width:150px;max-width:300px}
#tip .t{font-weight:600;margin-bottom:4px;color:var(--ink)}
#tip .r{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:1px 0}
#tip .r .n{color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;min-width:0}
#tip .r .n i{width:12px;border-top:2.5px solid;display:inline-block;flex:none}
#tip .r .v{font-weight:600;color:var(--ink);white-space:nowrap}

/* tables */
.tv{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.neg{color:var(--bad)}
td.dt{white-space:nowrap}
tr:hover td{background:var(--surface-2)}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:3px;border:1px solid var(--border-strong);color:var(--ink-2);white-space:nowrap}
.pill.rma{border-color:var(--brand-deep);color:var(--brand-deep)}
.pill.ret{border-color:var(--ink);color:var(--ink)}
.pill.can{border-color:var(--muted)}
.prod{max-width:420px;overflow-wrap:anywhere}
.tbl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tbl-tools input{font:inherit;padding:6px 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--ink);min-width:220px;flex:1;max-width:360px}
.more{display:flex;justify-content:center;padding-top:10px}
.more button{border:0;background:var(--brand);color:#fff;font-weight:700;border-radius:4px;padding:8px 16px;cursor:pointer}
.more button:hover{background:var(--brand-deep)}

/* footer */
.notes{font-size:14px;color:var(--ink-2);margin-top:18px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.notes h3{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}
.notes ul{margin:0;padding-left:16px}
.notes li{margin:2px 0}
@media (prefers-reduced-motion:no-preference){ .bar,.seg{transition:filter .12s} }
@media (max-width:560px){ .hdr .meta{text-align:left} .kpi .val{font-size:27px} .side{grid-template-columns:1fr 1fr} .logo{height:40px} .hdr h1{font-size:22px} }
</style>

<div class="band"><header class="hdr">
  <div class="brand"><img class="logo" src="__LOGO__" alt="Wheels Below Retail" width="200" height="103"><h1>Sales dashboard<small id="subtitle">Net sales and gross profit from the invoice ledger</small></h1></div>
  <div class="meta" id="hdrmeta"></div>
</header></div>
<div class="wrap">

  <section class="fbar" aria-label="Filters">
    <div class="frow">
      <div class="fgroup grow"><span class="flab">Period</span><div class="chips" id="periodChips"></div></div>
      <div class="fgroup"><label class="flab" for="fMonth">Month</label><select id="fMonth"></select></div>
      <div class="fgroup"><label class="flab" for="fFrom">From</label><input type="date" id="fFrom"></div>
      <div class="fgroup"><label class="flab" for="fTo">To</label><input type="date" id="fTo"></div>
      <div class="fgroup"><span class="flab" aria-hidden="true">&nbsp;</span><button class="reset" id="reset" type="button">Reset filters</button></div>
    </div>
    <div class="fgrid">
      <div class="fgroup"><label class="flab" for="fChannel">Channel</label><select id="fChannel"></select></div>
      <div class="fgroup"><label class="flab" for="fGroup">Product</label><select id="fGroup"></select></div>
      <div class="fgroup"><label class="flab" for="fType">Type</label><select id="fType"></select></div>
      <div class="fgroup"><label class="flab" for="fSupplier">Supplier</label><select id="fSupplier"></select></div>
      <div class="fgroup"><label class="flab" for="fSeller">Seller</label><select id="fSeller"></select></div>
      <div class="fgroup"><label class="flab" for="fPay">Payment</label><select id="fPay"></select></div>
      <div class="fgroup"><label class="flab" for="fStatus">Status</label><select id="fStatus"></select></div>

  </section>
  <section class="grid g2">
    <div class="card" id="cardSupplier"></div>
    <div class="card" id="cardReturns"></div>
  </section>
  <section class="grid" style="grid-template-columns:1fr">
    <div class="card" id="cardTable"></div>
  </section>

  <footer class="notes" id="notes"></footer>
</div>
<div id="tip" hidden></div>

<script>
(function(){
'use strict';
/* ---------- CSV + cleaning: the single copy of the business rules ---------- */
/*CLEAN-START*/
const MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12,ENE:1,ABR:4,AGO:8,SET:9,DIC:12};
function parseCSV(text){ const rows=[]; let row=[], field='', q=false; const n=text.length; for(let i=0;i<n;i++){ const c=text[i]; if(q){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; continue; } if(c==='"'){ q=true; continue; } if(c===','){ row.push(field); field=''; continue; } if(c==='\r') continue; if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; continue; } field+=c; } if(field!==''||row.length){ row.push(field); rows.push(row); } return rows; }
const txt=v=>(v==null?'':String(v)).trim();
function num(v){ let s=txt(v); if(!s) return 0; let neg=false; if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); } s=s.replace(/[$,\s]/g,''); if(s.startsWith('-')){ neg=!neg; s=s.slice(1); } const x=parseFloat(s); return isFinite(x)?(neg?-x:x):0; }
const titleCase=s=>s.toLowerCase().replace(/(^|[^a-z0-9])([a-z])/g,(m,p,c)=>p+c.toUpperCase());
function typeGroup(t){ t=t.toUpperCase(); if(t.startsWith('NEW WHEEL')) return 'Wheels'; if(t.startsWith('NEW TIRE')) return 'New tires'; if(t.startsWith('USED TIRE')) return 'Used tires'; if(t.startsWith('PACKAGE')) return 'Packages'; if(t.startsWith('ACCESSOR')) return 'Accessories'; if(t.startsWith('LABOR')||t.startsWith('CUSTOM PAINT')) return 'Labor'; return 'Other'; }
function channelName(c){ const u=c.toUpperCase(); if(u.includes('SHOPIFY')) return 'Shopify'; if(u.includes('EBAY')) return 'eBay'; if(u.includes('AMAZON')) return 'Amazon'; return u?titleCase(u):'Unknown'; }
function statusClass(s){ s=s.toUpperCase(); if(s.startsWith('CANCEL')) return 'canceled'; if(s.startsWith('TEST')) return 'test'; if(s.startsWith('FRAUD')||s.startsWith('CHARGEBACK')||s.startsWith('LOST')) return 'loss'; if(s.startsWith('RMA')) return 'rma'; if(s.startsWith('RETURN')||s.startsWith('REFUND')||s.startsWith('PARTIALLY REFUNDED')||s.includes('RETURN')) return 'return'; return 'ok'; }
function sellerName(s){ s=s.toUpperCase().replace(/\s+/g,''); if(!s||s.startsWith('GASTADO')) return ''; s=s.replace(/JAMIE/g,'JAIME'); return s.split('/').filter(Boolean).map(titleCase).sort().join('/'); }
function payGroup(p){ p=p.toUpperCase().trim(); if(!p||p==='NA'||p==='N/A') return 'Not recorded'; if(/AFFIRM|SNAP|ACIMA|PAY ?TOMORROW|INSTALLMENT|KAFENE|KATAPULT|WESTCREEK|KOALIFI|UOWN|FINANCE|FIANCE/.test(p)) return 'Financing'; if(p.includes('AMAZON')) return 'Amazon'; if(p.includes('EBAY')) return 'eBay'; if(p.includes('PAYPAL')) return 'PayPal'; if(/CASH|WIRE|ZELLE|CHECK|ACH\b|VENMO/.test(p)) return 'Cash / wire'; if(/VISA|MASTER|AMERICAN|AMEX|DISCOVER|APPLE|GOOGLE|SHOP PAY|SHOPIFY|CARD/.test(p)) return 'Card'; return 'Other'; }
function resolveDay(s, mon){ const m=/^(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/.exec(txt(s)); if(!m) return [1,'missing']; const a=+m[1], b=+m[2]; if(a===mon&&b>=1&&b<=31) return [b,'ok']; if(b===mon&&a>=1&&a<=31) return [a,'swapped']; return [(b>=1&&b<=31)?Math.min(b,28):1,'mismatch']; }
function cleanCSV(text){
  const rows=parseCSV(text); if(!rows.length) throw new Error('empty file');
  const hdr=rows[0].map(h=>txt(h).toUpperCase()); const col=n=>hdr.indexOf(n);
  const I={date:col('DATE'),month:col('MONTH'),year:col('YEAR'),inv:col('INVOICE'),ch:col('CANAL DE VENTA'),ful:col('FULFILLMENT'),st:col('STATUS'),type:col('TYPE'),prod:col('PRODUCT'),qty:col('QTY'),sales:col('VENTA'),cost:col('COSTO'),ship:col('SHIPPING'),fee:col('FEE'),profit:col('PROFIT'),seller:col('SELLER'),rcost:col('RETURN COST'),pay:col('PAYMENT TYPE')};
  if(I.date<0||I.year<0||I.month<0||I.sales<0||I.profit<0) throw new Error('the sheet columns changed (DATE, MONTH, YEAR, VENTA, PROFIT are required)');
  const diag={}; const bump=k=>{ diag[k]=(diag[k]||0)+1; }; const out=[];
  for(let i=1;i<rows.length;i++){ const r=rows[i]; if(!r.some(c=>txt(c)!=='')) continue; const g=k=>I[k]>=0?r[I[k]]:'';
    const year=parseInt(txt(g('year')),10); if(!isFinite(year)){ bump('skip: no YEAR (summary rows)'); continue; }
    const mon=MON[txt(g('month')).toUpperCase().slice(0,3)]; if(!mon){ bump(num(g('sales'))!==0?'skip: no MONTH but has VENTA':'skip: no MONTH (empty pre-filled rows)'); continue; }
    let [day,how]=resolveDay(g('date'),mon); let dt=new Date(Date.UTC(year,mon-1,day)); if(dt.getUTCMonth()!==mon-1){ dt=new Date(Date.UTC(year,mon-1,1)); how='clamped'; } bump('date '+how); const iso=dt.toISOString().slice(0,10);

}

/* ---------- periods ---------- */
function addMonths(iso, n){ const y=+iso.slice(0,4), m=+iso.slice(5,7)-1+n, d=+iso.slice(8,10); const dt=new Date(Date.UTC(y+Math.floor(m/12), ((m%12)+12)%12, 1)); const last=new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth()+1, 0)).getUTCDate(); dt.setUTCDate(Math.min(d,last)); return dt.toISOString().slice(0,10); }
function addDays(iso, n){ const dt=new Date(iso+'T00:00:00Z'); dt.setUTCDate(dt.getUTCDate()+n); return dt.toISOString().slice(0,10); }
function fmtDate(iso){ const [y,m,d]=iso.split('-'); return `${MONTHS[+m-1]} ${+d}, ${y}`; }
function buildPeriods(){
  const P=[];
  P.push({id:'all', label:'All time', range:[minDate,maxDate], cmp:null, name:`${fmtDate(minDate)} – ${fmtDate(maxDate)}`});
  for (const y of [...years].reverse()){
    if (y===curYear){ const cmpEnd=`${y-1}${maxDate.slice(4)}`; P.push({id:String(y), label:`${y} YTD`, range:[`${y}-01-01`, maxDate], cmp: years.includes(y-1)?[`${y-1}-01-01`, cmpEnd]:null, cmpLabel:`vs ${y-1} YTD`, name:`Jan 1 – ${fmtDate(maxDate)}`}); }
    else { P.push({id:String(y), label:String(y), range:[`${y}-01-01`,`${y}-12-31`], cmp: years.includes(y-1)?[`${y-1}-01-01`,`${y-1}-12-31`]:null, cmpLabel:`vs ${y-1}`, name:`Full year ${y}`}); }
  }
  const l12start=addDays(addMonths(maxDate,-12),1);
  P.push({id:'l12', label:'Last 12 months', range:[l12start,maxDate], cmp:[addMonths(l12start,-12), addDays(l12start,-1)], cmpLabel:'vs prior 12 months', name:`${fmtDate(l12start)} – ${fmtDate(maxDate)}`});

}
function setData(rows, diag, src){

  maxDate=R.reduce((m,r)=>r.d>m?r.d:m,'0000'); minDate=R.reduce((m,r)=>r.d<m?r.d:m,'9999'); curYear=+maxDate.slice(0,4);

  if(!(f.period==='custom' && f.from && f.to) && !PERIODS.some(p=>p.id===f.period)) f.period=String(curYear);

}

/* ---------- state ---------- */
const f = {period:null, month:0, channel:'all', group:'all', type:'all', seller:'all', supplier:'all', pay:'all', status:'all', from:'', to:''};

function customPeriod(){ const a=f.from<=f.to?f.from:f.to, b=f.from<=f.to?f.to:f.from; const y=iso=>String(+iso.slice(0,4)-1)+iso.slice(4); return {id:'custom', label:'Custom dates', range:[a,b], cmp:[y(a),y(b)], cmpLabel:'vs same dates a year earlier', name:`${fmtDate(a)} – ${fmtDate(b)}`}; }

function period(){ const base=(f.period==='custom' && f.from && f.to) ? customPeriod() : PERIODS.find(p=>p.id===f.period); if(!f.month || !isYearPeriod()) return base;
  const Y=+base.id, mm=String(f.month).padStart(2,'0'), mn=MONTHS_FULL[f.month-1]; const lastDay=new Date(Date.UTC(Y, f.month, 0)).getUTCDate();
  let end=`${Y}-${mm}-${String(lastDay).padStart(2,'0')}`; if(end>maxDate) end=maxDate; const start=`${Y}-${mm}-01`;
  const P={...base, id:base.id, range:[start,end], name: end<`${Y}-${mm}-${String(lastDay).padStart(2,'0')}` ? `${MONTHS[f.month-1]} 1 – ${fmtDate(end)}` : `${mn} ${Y}`};
  if(base.cmp){ P.cmp=[`${Y-1}-${mm}-01`, `${Y-1}${end.slice(4)}`]; P.cmpLabel=`vs ${mn} ${Y-1}`; }
  return P; }
function dimOK(r, ignoreStatus){ return (f.channel==='all'||r.ch===f.channel) && (f.group==='all'||r.grp===f.group) && (f.type==='all'||r.type===f.type) && (f.seller==='all'||r.seller===f.seller) && (f.supplier==='all'||r.ful===f.supplier) && (f.pay==='all'||r.payg===f.pay) && (ignoreStatus || f.status==='all' || r.sc===f.status); }

/* ---------- formatting ---------- */
const nf0 = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('en-US',{maximumFractionDigits:1, minimumFractionDigits:1});
function money(v){ const s=v<0?'-':''; return s+'$'+nf0.format(Math.abs(v)); }  /* whole dollars everywhere, no K/M abbreviations */

function niceTicks(max, n=4){ if (max<=0) return {step:1,ticks:[0,1],max:1}; const raw=max/n, mag=Math.pow(10,Math.floor(Math.log10(raw))); const cand=[1,2,2.5,5,10].map(c=>c*mag); const step=cand.find(c=>c>=raw)||cand[cand.length-1]; const top=Math.ceil(max/step)*step; const ticks=[]; for(let v=0; v<=top+1e-9; v+=step) ticks.push(+v.toFixed(6)); return {step,ticks,max:top}; }

/* ---------- aggregation ---------- */
function agg(rows){ const a={sales:0,profit:0,cost:0,units:0,items:0,lines:0,orders:new Set()}; for(const r of rows){ a.sales+=r.sales; a.profit+=r.profit; a.cost+=r.cost; a.lines++; if (UNIT_GROUPS.has(r.grp)) a.units+=r.qty; if (PRODUCT_GROUPS.has(r.grp)) a.items+=r.qty; if (r.inv) a.orders.add(r.inv);} a.n=a.orders.size; a.margin=a.sales? a.profit/a.sales : NaN; a.aov=a.n? a.sales/a.n : NaN; return a; }

function byMonth(rows, months){ const m=new Map(months.map(k=>[k,{sales:0,profit:0,orders:new Set(),lines:0,items:0}])); for(const r of rows){ const o=m.get(r.ym); if(!o) continue; o.sales+=r.sales; o.profit+=r.profit; o.lines++; if(PRODUCT_GROUPS.has(r.grp)) o.items+=r.qty; if(r.inv) o.orders.add(r.inv);} return months.map(k=>({ym:k, ...m.get(k), n:m.get(k).orders.size})); }

function stackedChart(viz, W, months, series, opts){
  // series: [{name, cls, color, values}] counts stacked per month
  viz.replaceChildren();
  const n=months.length, Hh=210, padL=40, padR=12, padT=10, padB=32; const plotW=Math.max(60,W-padL-padR), plotH=Hh-padT-padB;
  const totals=months.map((_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0)); const maxV=Math.max(0,...totals);
  if (maxV<=0){ viz.append(H('div','empty','No cancellations or returns in this period')); return; }
  const {ticks,max}=niceTicks(maxV,3);
  const svg=S('svg',{viewBox:`0 0 ${W} ${Hh}`,width:W,height:Hh,role:'img','aria-label':opts.aria||''});
  const yOf=v=>padT+plotH-(v/max)*plotH; const slot=plotW/n, bw=Math.min(24,Math.max(2,slot-Math.max(2,slot*0.35))), xOf=i=>padL+slot*i+slot/2;
  for(const t of ticks){ const y=yOf(t); svg.append(S('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:t===0?'base':'gl'})); svg.append(S('text',{x:padL-8,y:y+4,'text-anchor':'end',class:'ax'},int(t))); }
  const labelEvery = n<=14 ? 1 : (n<=40 ? 3 : 0);
  months.forEach((ym,i)=>{ const mm=+ym.slice(5,7), yy=ym.slice(0,4); let lab=null; if(opts.xLabel) lab=opts.xLabel(ym,i); else if(labelEvery===1) lab=MONTHS[mm-1]+((mm===1||i===0)&&n>1?` ’${yy.slice(2)}`:''); else if(labelEvery===3){ if(mm%3===1) lab=MONTHS[mm-1]+(mm===1?` ’${yy.slice(2)}`:''); } else if(mm===1) lab=yy; if(lab) svg.append(S('text',{x:xOf(i),y:Hh-10,'text-anchor':'middle',class:'ax'},lab)); });
  months.forEach((_,i)=>{ let acc=0; series.forEach((s,si)=>{ const v=s.values[i]||0; if(v<=0) return; const y1=yOf(acc), y0=yOf(acc+v); const h=Math.max(0,y1-y0-(acc>0?2:0)); const x=xOf(i)-bw/2; const top=y0; if(h>0) svg.append(S('rect',{x,y:top,width:bw,height:h,class:'seg '+s.cls,'data-i':i, rx: 0})); acc+=v; }); });
  months.forEach((ym,i)=>{ const rect=S('rect',{x:padL+slot*i,y:padT,width:slot,height:plotH,class:'hit',tabindex:0}); const show=e=>{ svg.querySelectorAll('.seg.hover').forEach(b=>b.classList.remove('hover')); svg.querySelectorAll(`.seg[data-i="${i}"]`).forEach(b=>b.classList.add('hover')); showTip(e.pageX!=null?e:{pageX:rect.getBoundingClientRect().left+window.scrollX,pageY:rect.getBoundingClientRect().top+window.scrollY}, opts.tipTitle(i), [...series.map(s=>[s.name, int(s.values[i]||0), s.color]), ['Total', int(totals[i])]]); }; rect.addEventListener('pointerenter',show); rect.addEventListener('pointermove',moveTip); rect.addEventListener('focus',show); rect.addEventListener('pointerleave',()=>{svg.querySelectorAll('.seg.hover').forEach(b=>b.classList.remove('hover')); hideTip();}); rect.addEventListener('blur',hideTip); svg.append(rect); });
  viz.append(svg); viz.append(legend(series.map(s=>({label:s.name,color:s.color}))));
}

function sparkline(vals){
  const w=84,h=30,p=3; const svg=S('svg',{viewBox:`0 0 ${w} ${h}`,class:'spark','aria-hidden':'true'}); const n=vals.length; if(n<2) return svg; const max=Math.max(...vals,1e-9); const x=i=>p+(w-2*p)*i/(n-1), y=v=>h-p-(v/max)*(h-2*p);
  let d=''; vals.forEach((v,i)=>{ d+=(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); }); svg.append(S('path',{d,fill:'none',class:'lde','stroke-width':1.5,'stroke-linejoin':'round'})); svg.append(S('circle',{cx:x(n-1),cy:y(vals[n-1]),r:3,class:'c1 ring'})); return svg;
}

const LIVE_URL=`https://docs.google.com/spreadsheets/d/${META.sheetId}/export?format=csv&gid=${META.gid}`;
const timeStr=d=>d? d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
function renderStatus(){
  const m=$('hdrmeta'); m.replaceChildren();
  const m1=H('div'); m1.append(document.createTextNode('Data through '), H('b',null,fmtDate(maxDate)), document.createTextNode(' · '));
  const badge=H('span','badge '+(SOURCE.live?'live':'snap')); badge.append(document.createElement('i'));
  badge.append(document.createTextNode(SOURCE.loading? 'Reading the sheet…' : SOURCE.live? `Live · read ${timeStr(SOURCE.at)}` : `Snapshot from ${META.generated}`)); m1.append(badge);
  const rb=H('button','reset', SOURCE.loading?'…':'Refresh'); rb.type='button'; rb.disabled=!!SOURCE.loading; rb.onclick=()=>refreshLive(true); m1.append(rb);
  const m2=H('div'); if(SOURCE.error && !SOURCE.live) m2.append(H('span','warn',`Live read failed: ${SOURCE.error}. `));
  const a=H('a',null,'Open the Google Sheet'); a.href=META.sheetUrl; a.target='_blank'; a.rel='noopener'; m2.append(a); m.append(m1,m2);
}
let refreshing=false, lastLive=0;
async function refreshLive(){
  if(refreshing) return; refreshing=true; SOURCE={...SOURCE, loading:true}; renderStatus();
  try{ const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(), 25000);
    const res=await fetch(LIVE_URL,{cache:'no-store', signal:ctrl.signal}); clearTimeout(t);
    if(!res.ok) throw new Error('Google answered HTTP '+res.status);
    const text=await res.text(); const {rows,diag}=cleanCSV(text); if(rows.length<10) throw new Error('the sheet came back nearly empty');
    lastLive=Date.now(); setData(rows, diag, {live:true, at:new Date(), error:null, loading:false});
  }catch(e){ const msg = e.name==='AbortError' ? 'timed out' : (e instanceof TypeError ? 'the browser blocked the request (offline, a strict sandbox, or the sheet is no longer shared)' : e.message); SOURCE={...SOURCE, loading:false, error:msg}; renderStatus(); }
  finally{ refreshing=false; }
}
setInterval(()=>refreshLive(), 10*60*1000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && Date.now()-lastLive>2*60*1000) refreshLive(); });

let tableQ=''; let tableShown=40;
function renderTable(cur){
  const el=cards.table; el.replaceChildren();
  const h=H('div','card-h'); const left=H('div'); left.append(H('h2',null,'Invoice lines')); const sub=H('div','sub'); left.append(sub); h.append(left); el.append(h);
  const tools=H('div','tbl-tools'); const inp=H('input'); inp.type='search'; inp.id='tblSearch'; inp.placeholder='Search product, invoice, supplier, payment…'; inp.value=tableQ; tools.append(inp); el.append(tools);
  const tv=H('div','tv'); el.append(tv); const more=H('div','more'); el.append(more);
  const sorted=[...cur].sort((a,b)=> a.d===b.d ? (b.inv>a.inv?1:-1) : (a.d<b.d?1:-1));
  const draw=()=>{ const q=tableQ.trim().toLowerCase(); const rows=q? sorted.filter(r=>(r.prod+' '+r.inv+' '+r.ful+' '+r.pay+' '+r.type+' '+r.seller).toLowerCase().includes(q)) : sorted; sub.textContent=`${int(rows.length)} lines · newest first · canceled orders excluded`;
    tv.replaceChildren(); const t=H('table'); const th=H('tr'); [['Date'],['Invoice'],['Channel'],['Product']  ,['Type'],['Supplier'],['Seller'],['Qty','n'],['Net sales','n'],['Profit','n'],['Margin','n'],['Status']].forEach(([n,c])=>th.append(H('th',c,n))); const thead=H('thead'); thead.append(th); t.append(thead);
    const tb=H('tbody'); for(const r of rows.slice(0,tableShown)){ const tr=H('tr'); tr.append(H('td','dt',r.d)); tr.append(H('td',null,r.inv)); tr.append(H('td',null,r.ch)); tr.append(H('td','prod',r.prod||'—')); tr.append(H('td',null,r.type.toLowerCase().replace(/(^|\s|-)\S/g,s=>s.toUpperCase()))); tr.append(H('td',null,r.ful)); tr.append(H('td',null,r.seller||'—')); tr.append(H('td','n',int(r.qty))); tr.append(H('td','n',money(r.sales,true))); const pt=H('td','n',money(r.profit,true)); if(r.profit<0) pt.classList.add('neg'); tr.append(pt); tr.append(H('td','n',pct(r.sales?r.profit/r.sales:NaN))); const st=H('td'); if(r.sc==='rma') st.append(H('span','pill rma', r.paired?'RMA · original':(r.sales<0||r.qty<0?'RMA · reversal':'RMA'))); else if(r.sc==='return') st.append(H('span','pill ret',r.st.includes('REFUND')?'REFUND':'RETURN')); else st.textContent='Sold'; tr.append(st); tb.append(tr);} t.append(tb); tv.append(t);
    more.replaceChildren(); if(rows.length>tableShown){ const b=H('button',null,`Show 40 more (${int(rows.length-tableShown)} left)`); b.type='button'; b.onclick=()=>{ tableShown+=40; draw(); }; more.append(b);} };
  inp.addEventListener('input',()=>{ tableQ=inp.value; tableShown=40; draw(); });
  draw();
}

function renderNotes(){
  const n=$('notes'); n.replaceChildren();
  const sec=(title, items)=>{ const d=H('div'); d.append(H('h3',null,title)); const ul=H('ul'); for(const it of items){ const li=H('li'); if (typeof it==='string') li.textContent=it; else li.append(...it); ul.append(li);} d.append(ul); return d; };
  const ex=DIAG, dt=DIAG;
  const a=H('a',null,'the Google Sheet'); a.href=META.sheetUrl; a.target='_blank'; a.rel='noopener';
  n.append(sec('Where the numbers come from',[ [document.createTextNode('Tab “'+META.tab+'” of '), a, document.createTextNode(`, ${int(R.length)} invoice lines from ${fmtDate(minDate)} to ${fmtDate(maxDate)}${SOURCE.live?', read live from the sheet':', from the snapshot embedded in this page'}.`)], 'Net sales is the VENTA column (before tax). Gross profit is the PROFIT column, which already nets out cost, shipping, fees and return costs. Margin is profit divided by net sales.', 'Orders count distinct invoice numbers. “Products sold” sums the QTY column on wheel, tire, package and accessory lines (labor, shipping and fee lines are not products). “Wheels & tires sold” counts wheel, tire and package units only. Return lines with negative quantities reduce the totals.', 'Year-to-date comparisons use the same calendar window of the previous year, ending on the latest invoice date.' ]));
  n.append(sec('What was left out or repaired',[ `Since 2023 a returned order appears as its original line relabeled CANCELED plus an RMA line with negative amounts. Both legs are kept, so they net to zero and match a plain SUMIF on the sheet (${int(ex['canceled paired with RMA (kept)']||0)} lines). A CANCELED line with nothing offsetting it (the 2021–2022 convention) is an order that never shipped and is excluded; those appear only in the cancellations panel. Rows marked TEST were dropped (${int(ex['skip: TEST rows']||0)} lines).`, 'RMA, returned and refunded lines stay in sales, since their PROFIT already reflects the return; they are flagged in the invoice table.', `Month and year come from the MONTH and YEAR columns. ${int(dt['date swapped']||0)} DATE cells had day and month swapped and were repaired; ${int((dt['date mismatch']||0)+(dt['date missing']||0)+(dt['date clamped']||0))} unreadable dates were placed within their month.`, `${int(ex['skip: no MONTH (empty pre-filled rows)']||0)} empty pre-filled rows and ${int(ex['skip: no YEAR (summary rows)']||0)} summary rows at the bottom of the tab were skipped.` ]));
  n.append(sec('Keeping it current',[ 'The page reads the sheet directly every time it opens, every 10 minutes while it stays open, and when you press Refresh. New rows in the sheet show up on the next read.', 'If the sheet cannot be reached, the page falls back to the snapshot embedded when it was last built (python3 build.py in the project folder).', 'Filters are remembered in this browser only. Every chart has a Table view with the same numbers.' ]));
}
